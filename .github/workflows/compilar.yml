name: Compilar Visible Barriers Forge

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Forge MDK
        shell: bash
        run: |
          set -e
          mkdir mdk
          curl -L --fail -o forge-mdk.zip "https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.12/forge-1.20.1-47.4.12-mdk.zip"
          unzip -q forge-mdk.zip -d mdk
          cp -R mdk/gradle .
          cp mdk/gradlew .
          cp mdk/gradlew.bat .
          chmod +x gradlew

      - name: Recuperar recursos oficiales de Visible Barriers
        shell: bash
        run: |
          set -e
          curl -L --fail -o visiblebarriers-source.tar.gz "https://github.com/AmyMialeeMods/visiblebarriers/archive/0ad926196a21e8aa0a52404c9d6aeda475af67a9.tar.gz"
          tar -xzf visiblebarriers-source.tar.gz
          upstream="visiblebarriers-0ad926196a21e8aa0a52404c9d6aeda475af67a9/src/main/resources"
          mkdir -p src/main/resources/assets
          cp -R "$upstream/assets/." src/main/resources/assets/
          if [ -d "$upstream/resourcepacks" ]; then
            cp -R "$upstream/resourcepacks" src/main/resources/
          fi
          if [ -f "$upstream/pack.mcmeta" ]; then
            cp "$upstream/pack.mcmeta" src/main/resources/
          fi

          echo "Usando las texturas originales del mod Visible Barriers..."

          echo "Comprobando modelos y estados de bloque requeridos..."
          test -f src/main/resources/assets/minecraft/blockstates/barrier.json
          test -f src/main/resources/assets/minecraft/blockstates/light.json
          test -f src/main/resources/assets/minecraft/blockstates/structure_void.json
          test -f src/main/resources/assets/visiblebarriers/models/block/barrier.json
          test -f src/main/resources/assets/visiblebarriers/models/block/light_00.json
          test -f src/main/resources/assets/visiblebarriers/models/block/structure_void.json
          rm -rf visiblebarriers-* visiblebarriers-source.tar.gz forge-mdk.zip mdk

      - name: Compilar
        shell: bash
        run: ./gradlew build --no-daemon

      - name: Publicar JAR
        uses: actions/upload-artifact@v4
        with:
          name: visible-barriers-forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
