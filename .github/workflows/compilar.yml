name: Compilar Visible Barriers Fabric

on:
  workflow_dispatch:
  push:
    branches: [fabric-migration-in-progress]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Recuperar recursos originales y Gradle Wrapper
        shell: bash
        run: |
          set -e
          curl -L --fail -o visiblebarriers-source.tar.gz "https://github.com/AmyMialeeMods/visiblebarriers/archive/0ad926196a21e8aa0a52404c9d6aeda475af67a9.tar.gz"
          tar -xzf visiblebarriers-source.tar.gz
          upstream="visiblebarriers-0ad926196a21e8aa0a52404c9d6aeda475af67a9"
          mkdir -p gradle/wrapper src/main/resources/assets
          cp "$upstream/gradlew" .
          cp "$upstream/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/
          cp "$upstream/gradle/wrapper/gradle-wrapper.properties" gradle/wrapper/
          cp -R "$upstream/src/main/resources/assets/." src/main/resources/assets/
          if [ -d "$upstream/src/main/resources/resourcepacks" ]; then
            cp -R "$upstream/src/main/resources/resourcepacks" src/main/resources/
          fi
          chmod +x gradlew
          rm -rf "$upstream" visiblebarriers-source.tar.gz

      - name: Comprobar archivos Fabric y recursos
        shell: bash
        run: |
          set -e
          test -f src/main/resources/fabric.mod.json
          test -f src/main/resources/visiblebarriers.mixins.json
          test -f src/main/resources/visiblebarriers.accesswidener
          test -f src/main/resources/assets/minecraft/blockstates/barrier.json
          test -f src/main/resources/assets/visiblebarriers/models/block/barrier.json
          ! grep -R -nE 'net\.minecraftforge|VisibleBarriersForge|DeferredRegister|RegistryObject' src/main/java

      - name: Compilar
        run: ./gradlew build --no-daemon

      - name: Publicar JAR
        uses: actions/upload-artifact@v4
        with:
          name: visible-barriers-fabric-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
